name: language_translator_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: "^3.8.1"

dependencies:
  flutter:
    sdk: flutter

  # Core / UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  animate_do: ^3.0.2
  fluttertoast: ^8.2.2

  shared_preferences: ^2.1.0




  # Image / OCR
  image_picker: ^1.0.2
  google_mlkit_text_recognition: ^0.15.0

  # Speech, translation, and TTS
  speech_to_text: ^7.3.0
  translator: ^1.0.3+1
  flutter_tts: ^3.8.2
  google_mlkit_language_id: ^0.13.0
  camera: ^0.10.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # Add flutter_launcher_icons to auto-generate app icons:
  flutter_launcher_icons: ^0.13.1

# flutter_launcher_icons configuration (top-level, not under flutter:)
flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icon/app_icon.png
